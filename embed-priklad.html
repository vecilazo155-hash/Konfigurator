<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D konfigurátor – WoodPlast (príklad vloženia na stránku)</title>
<style>body{margin:0;font-family:Inter,Arial,sans-serif}header{padding:14px 20px;background:#2D2A26;color:#fff}main{max-width:1400px;margin:0 auto}</style>
</head>
<body>
<header>Tu je hlavička webu woodplast.sk (menu, logo…)</header>
<main>
<!-- WoodPlast 3D konfigurátor – vloženie na stránku -->
<iframe id="wp3d" src="https://vecilazo155-hash.github.io/Konfigurator/?embed=1" title="3D konfigurátor WoodPlast" style="width:100%;min-height:900px;border:0;display:block" allow="camera; xr-spatial-tracking; clipboard-write; web-share" loading="lazy"></iframe>
<script>
(function(){
  var f=document.getElementById("wp3d");
  if(/^#(k|p)=/.test(location.hash)) f.src=f.src.split("#")[0]+location.hash; /* odkaz na konfiguráciu (#k=) alebo produkt a dekor (#p=) zo stránky webu */
  window.addEventListener("message", function(e){
    var d=e.data; if(!d||d.type!=="wp3d") return;
    if(d.event==="height"||d.event==="ready"){ if(d.data&&d.data.height) f.style.height=Math.max(700, d.data.height)+"px"; }
    if(d.event==="inquiry"){ /* dopyt odišiel – napr. meranie konverzie alebo CRM */
      try{ window.dataLayer=window.dataLayer||[]; window.dataLayer.push({event:"wp3d_inquiry", product:d.data.product, total:d.data.total, priced:d.data.priced}); }catch(x){}
    }
    if(d.event==="config"){ /* d.data: {code, title, total, product, link} – napr. uložiť do session */ }
  });
  /* otvoriť konfiguráciu z odkazu stránky: f.contentWindow.postMessage({type:"wp3d", cmd:"load", code:"WP2…"}, "*"); */
})();
</script>
</main>
</body>
</html>
